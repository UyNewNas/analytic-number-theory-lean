name: Lean build and trust audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reject executable sorry/admit in tracked Lean sources
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          files = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.lean"]
          ).decode().split("\0")
          files = [pathlib.Path(path) for path in files if path]
          if not files:
              print("No tracked Lean sources found.", file=sys.stderr)
              sys.exit(1)

          token = re.compile(r"\b(?:sorry|admit)\b")
          failures = []

          # Preserve newlines while removing strings and nested comments.
          # This catches `by sorry` without rejecting words in documentation.
          def executable_text(source: str) -> str:
              out = []
              i = 0
              block_depth = 0
              in_string = False
              while i < len(source):
                  if block_depth:
                      if source.startswith("/-", i):
                          block_depth += 1
                          out.extend("  ")
                          i += 2
                      elif source.startswith("-/", i):
                          block_depth -= 1
                          out.extend("  ")
                          i += 2
                      else:
                          out.append("\n" if source[i] == "\n" else " ")
                          i += 1
                  elif in_string:
                      if source[i] == "\\" and i + 1 < len(source):
                          out.extend("  ")
                          i += 2
                      elif source[i] == '"':
                          in_string = False
                          out.append(" ")
                          i += 1
                      else:
                          out.append("\n" if source[i] == "\n" else " ")
                          i += 1
                  elif source.startswith("--", i):
                      end = source.find("\n", i)
                      if end == -1:
                          out.extend(" " * (len(source) - i))
                          break
                      out.extend(" " * (end - i))
                      i = end
                  elif source.startswith("/-", i):
                      block_depth = 1
                      out.extend("  ")
                      i += 2
                  elif source[i] == '"':
                      in_string = True
                      out.append(" ")
                      i += 1
                  else:
                      out.append(source[i])
                      i += 1
              return "".join(out)

          for path in files:
              code = executable_text(path.read_text(encoding="utf-8"))
              for match in token.finditer(code):
                  line = code.count("\n", 0, match.start()) + 1
                  failures.append(f"{path}:{line}: executable {match.group(0)}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print(f"Checked {len(files)} tracked Lean source files.")
          PY

      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build Lean targets with diagnostic capture
        id: lean_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build PrimeNumberTheoremAnd AnalyticNumberTheory 2>&1 | tee /tmp/lake-build.log

      - name: Publish Lean build diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          LEAN_BUILD_OUTCOME: ${{ steps.lean_build.outcome }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- ant-ci-diagnostic -->'
            const log = fs.existsSync('/tmp/lake-build.log')
              ? fs.readFileSync('/tmp/lake-build.log', 'utf8')
              : 'The Lean build did not create /tmp/lake-build.log.'
            const diagnostic = log.split('\n')
              .filter(line => /error:|warning:|declaration uses|failed|Building/.test(line))
              .slice(-160)
              .join('\n') || log.slice(-12000)
            const body = `${marker}\n## CI diagnostic\n\n` +
              `Lean build outcome: **${process.env.LEAN_BUILD_OUTCOME}**.\n\n` +
              '```text\n' + diagnostic.slice(-12000) + '\n```'
            if (!context.payload.pull_request) {
              core.info(body)
              return
            }
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 })
            const prior = comments.find(comment => comment.body?.includes(marker))
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Fail if Lean build failed
        if: steps.lean_build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Audit public theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean Audit.lean 2>&1 | tee /tmp/axioms.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('/tmp/axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          expected_reports = 420
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          if len(reports) != expected_reports:
              print(
                  f'Expected {expected_reports} public API axiom reports, found {len(reports)}.',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Public API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print('Public API axiom whitelist passed: ' + ', '.join(sorted(used)))
          PY
