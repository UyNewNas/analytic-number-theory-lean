          import sys

          output = pathlib.Path('/tmp/dirichlet-logderiv-axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          axiom_free_reports = re.findall(r'does not depend on any axioms', output)
          report_count = len(reports) + len(axiom_free_reports)
          expected_reports = 11
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          if report_count != expected_reports:
              print(
                  f'Expected {expected_reports} finite-rectangle axiom reports, found {report_count} '
                  f'({len(reports)} with dependencies, {len(axiom_free_reports)} axiom-free).',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Finite-rectangle Dirichlet API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              'Finite-rectangle Dirichlet axiom whitelist passed for '
              f'{report_count} reports ({len(reports)} with dependencies, '
              f'{len(axiom_free_reports)} axiom-free): '
              + ', '.join(sorted(used))
          )
          PY

      - name: Audit Dirichlet orthogonality and moment slice
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          lake env lean AuditDirichletMoments.lean 2>&1 | tee /tmp/dirichlet-moments-axioms.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('/tmp/dirichlet-moments-axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          axiom_free_reports = re.findall(r'does not depend on any axioms', output)
          report_count = len(reports) + len(axiom_free_reports)
          expected_reports = 20
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          if report_count != expected_reports:
              print(
                  f'Expected {expected_reports} orthogonality/moment axiom reports, found {report_count} '
                  f'({len(reports)} with dependencies, {len(axiom_free_reports)} axiom-free).',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Dirichlet orthogonality/moment API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              'Dirichlet orthogonality/moment axiom whitelist passed for '
              f'{report_count} reports ({len(reports)} with dependencies, '
              f'{len(axiom_free_reports)} axiom-free): '
              + ', '.join(sorted(used))
          )
          PY

      - name: Audit public theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean Audit.lean 2>&1 | tee /tmp/axioms.txt
          lake env lean AuditDirichletConditional.lean 2>&1 | tee -a /tmp/axioms.txt
          lake env lean AuditDirichletLogDerivative.lean 2>&1 | tee -a /tmp/axioms.txt
          lake env lean AuditDirichletMoments.lean 2>&1 | tee -a /tmp/axioms.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('/tmp/axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          axiom_free_reports = re.findall(r'does not depend on any axioms', output)
          report_count = len(reports) + len(axiom_free_reports)
          expected_reports = 531
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          if report_count != expected_reports:
              print(
                  f'Expected {expected_reports} public API axiom reports, found {report_count} '
                  f'({len(reports)} with dependencies, {len(axiom_free_reports)} axiom-free).',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Public API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              'Public API axiom whitelist passed for '
              f'{report_count} reports ({len(reports)} with dependencies, '
              f'{len(axiom_free_reports)} axiom-free): '
              + ', '.join(sorted(used))
          )
          PY
