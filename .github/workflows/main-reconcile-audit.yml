name: Main reconciliation focused audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  reconcile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: AnalyticNumberTheory

      - name: Audit staged main declarations
        shell: bash
        run: |
          set -o pipefail
          lake env lean MainReconcileAudit.lean 2>&1 | tee /tmp/main-reconcile-axioms.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('/tmp/main-reconcile-axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          empty_reports = re.findall(r'does not depend on any axioms', output)
          expected_reports = 38
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          found = len(reports) + len(empty_reports)
          if found != expected_reports:
              print(
                  f'Expected {expected_reports} reconciliation axiom reports, found {found}.',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Reconciliation API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print('Reconciliation axiom whitelist passed: ' + ', '.join(sorted(used)))
          PY
