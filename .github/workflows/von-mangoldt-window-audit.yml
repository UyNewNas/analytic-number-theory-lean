name: Von Mangoldt window focused audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  von-mangoldt-window-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: AnalyticNumberTheory

      - name: Reject placeholders in consumer slice
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' '\b(sorry|admit)\b' \
            AnalyticNumberTheory/PrimeDistribution/DyadicPrimeWindow.lean \
            AnalyticNumberTheory/Dirichlet/PrimeWindowWeights.lean \
            AnalyticNumberTheory/Dirichlet/VonMangoldtWindow.lean \
            AnalyticNumberTheory/Dirichlet/VonMangoldtPartialSums.lean; then
            echo 'Found forbidden placeholder in von-Mangoldt consumer slice.' >&2
            exit 1
          fi

      - name: Audit consumer-slice axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean AuditVonMangoldtWindow.lean 2>&1 | tee /tmp/von-mangoldt-window-axioms.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('/tmp/von-mangoldt-window-axioms.txt').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          axiom_free_reports = re.findall(r'does not depend on any axioms', output)
          report_count = len(reports) + len(axiom_free_reports)
          expected_reports = 25
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          if report_count != expected_reports:
              print(
                  f'Expected {expected_reports} von-Mangoldt-window axiom reports, found {report_count} '
                  f'({len(reports)} with dependencies, {len(axiom_free_reports)} axiom-free).',
                  file=sys.stderr,
              )
              sys.exit(1)

          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print(
                  'Von-Mangoldt window API uses non-whitelisted axioms: '
                  + ', '.join(sorted(unexpected)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              'Von-Mangoldt window axiom whitelist passed for '
              f'{report_count} reports: ' + ', '.join(sorted(used))
          )
          PY
