name = "analytic_number_theory"
version = "0.1.0"
keywords = ["mathematics", "number-theory", "prime-number-theorem"]
defaultTargets = ["AnalyticNumberTheory"]

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.33.0-rc1"

# Keep mathlib last so its transitive package revisions take precedence. This
# is required for cache hashes to match the exact Chen/mathlib environment.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e4c91783ca8e6a7c693ae624ade32fd22d4e43c1"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd"]

# Provenance-preserving exact-same-pin compatibility slice reused from
# subfish-zhou/liu-wang-ternary-goldbach-lean.  Only the neutral scalar Perron
# dependency closure is vendored; the upstream package itself is not added as
# a Lake dependency because it exports colliding AnalyticNumberTheory and
# PrimeNumberTheoremAnd library roots.
[[lean_lib]]
name = "BombieriVinogradov"
globs = ["BombieriVinogradov.+"]

# Bounded compile/integration surface for the project-neutral generic Perron
# series layer.  This intentionally excludes the source repository's
# character-specialized PerronSeries subtree.
[[lean_lib]]
name = "LiuWang"

[[lean_lib]]
name = "AnalyticNumberTheory"
globs = ["AnalyticNumberTheory"]
